---
- name: Install git, Docker and Docker Compose on GCE Ubuntu
  hosts: lesdemo
  user: tofuser
  become: yes

  vars:
    docker_user: tofuser
    docker_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

  tasks:
    - name: Install prerequisites and git
      apt:
        name:
          - git
          - ca-certificates
          - curl
          - gnupg
        state: present
        update_cache: yes

    - name: Remove conflicting distro Docker packages
      apt:
        name:
          - docker.io
          - docker-compose
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker is started and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add user to docker group
      user:
        name: "{{ docker_user }}"
        groups: docker
        append: yes

    - name: Reset SSH connection so group change takes effect
      meta: reset_connection

    - name: Verify installed versions
      command: "{{ item }}"
      loop:
        - git --version
        - docker --version
        - docker compose version
      register: versions
      changed_when: false

    - name: Display versions
      debug:
        msg: "{{ versions.results | map(attribute='stdout') | list }}"
